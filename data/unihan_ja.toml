# Unihan の kDefinition (英語) の日本語訳。
#
# 字義がこの表で唯一「読む」ところなのに英語のままで、意味を取るのに
# 手間が掛かっていた。原文と並べて出す。
#
# キーは kDefinition の原文そのもの。Unihan は Unicode License v3 なので、
# 出典を添えれば再配布できる (LICENSE-unicode)。zi.tools の訳語表
# (data/zi_tools_ja.toml) がリポジトリの外にあるのは、あちらの利用条件が
# 分からないため。事情が違うので、こちらはコミットする。
#
# 訳し方:
#
# * 「;」と「,」で区切られた語義は「・」と「、」で分ける。原文の区切りを
#   そのまま残すと、どこまでが 1 つの語義か読めない。
# * (same as X) → (X に同じ)、(ancient form of X) → (X の古字)、
#   (non-classical) → (俗字)、(Cant.) → (広東)、(interchangeable X) →
#   (X と通用)。原文の断わり書きは落とさない。
# * 生き物は和名。学名が併記されているものはそのまま残す。
# * 元素は「水銀 (原子番号 80)」の形。
#
# 訳の無いものは make html が数えて教える。

