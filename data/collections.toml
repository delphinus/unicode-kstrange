# サイトに並べる一覧。ハブ (docs/index.html) と、各ページ上部の切り替えの
# 両方がこれを読む。
#
#   slug   出力先 docs/<slug>/index.html と URL /<slug>/
#   title  見出し
#   lead   1 行の説明
#
# 字形 (docs/glyphs/) は全部で共有する。828 字の kStrange と 3,409 字の
# UK-source はかなり重なるので、コレクションごとに持つと同じ SVG を何度も配ることになる。

[[collection]]
slug = "kstrange"
title = "kStrange"
lead = "形が非典型的だと Unicode が分類した字"

[[collection]]
slug = "uk"
title = "UK-source"
lead = "英国が IRG へ提出した字。用例の書名とページが提出文書に残っている"
select = "uk"          # kIRG_UKSource を持つ字
facet = "ukdoc"        # 絞り込みは提出した作業集合 (WS2015 / WS2017 / WS2021)
glyph = "ukfont"       # 字形は提出文書の添付フォント

[[collection]]
slug = "u-source"
title = "まだ符号化されていない字"
lead = "UAX #45 に登録されたが、却下・異体字扱い・先送り・審議中のままの登録"
select = "usource"     # USourceData.txt のうち符号化されていないもの
facet = "status"       # 絞り込みは status (却下 / 異体字 / 先送り / 審議中 …)

[[collection]]
slug = "spoofing"
title = "見間違えやすい字"
lead = "取り違えの恐れがあるとして Unicode が組で指定した字"
